<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultura do Grau - Arte sobre duas rodas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">Grau<span>Bike</span></div>
        <nav>
            <ul>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#galeria">Galeria</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section id="sobre" class="card">
            <h1>A Arte do Grau</h1>
            <p>Mais do que empinar, o grau é estilo de vida, equilíbrio e controle total da bike. Uma cultura que cresce a cada dia nas ruas e nas pistas.</p>
            
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1485965120184-e220f721d03e?q=80&w=600&auto=format&fit=crop" alt="Manobra de grau de bike" id="foto-grau">
            </div>

            <div class="actions">
                <button id="btn-curtir" onclick="toggleCurtida()">
                    <i class="fa-regular fa-heart" id="icone-coracao"></i> 
                    <span id="texto-curtidas">Curtir</span> 
                    <span id="contador">0</span>
                </button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 GrauBike. Feito para a comunidade.</p>
    </footer>

    <script>
        let curtido = false;
        let totalCurtidas = 0;

        function toggleCurtida() {
            const botao = document.getElementById('btn-curtir');
            const icone = document.getElementById('icone-coracao');
            const contador = document.getElementById('contador');
            
            if (!curtido) {
                totalCurtidas++;
                icone.className = "fa-solid fa-heart"; // Muda para coração cheio
                botao.classList.add('liked');
                curtido = true;
            } else {
                totalCurtidas--;
                icone.className = "fa-regular fa-heart"; // Volta para coração vazio
                botao.classList.remove('liked');
                curtido = false;
            }
            
            contador.innerText = totalCurtidas;
        }
    </script>
</body>
</html>
